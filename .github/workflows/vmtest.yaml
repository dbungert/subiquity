name: VM Tests

on:
  push:
    paths-ignore:
      - 'doc/**'
  pull_request:
    paths-ignore:
      - 'doc/**'

jobs:
  vmtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install vmtest dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest virtinst fuseiso fuse3 libvirt-clients openssh-client

      - name: download ISO
        run: |
          cd ${{ runner.temp }}
          wget -q -O subiquity.iso \
            https://cdimage.ubuntu.com/ubuntu-server/daily-live/current/stonking-live-server-amd64.iso
          wget -q -O SHA256SUMS \
            https://cdimage.ubuntu.com/ubuntu-server/daily-live/current/SHA256SUMS
          grep stonking-live-server-amd64.iso SHA256SUMS | sha256sum -c
          ls -lh subiquity.iso

      - name: run vmtest
        run: |
          cd ${{ github.workspace }}
          PYTHONPATH=. pytest-3 --iso=${{ runner.temp }}/subiquity.iso -k test_bios_direct vmtests

      - name: cleanup
        if: always()
        run: rm -f ${{ runner.temp }}/subiquity.iso
